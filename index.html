<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe de O&L v2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>

<body>

<div class="app">

<h1>Informe de O&L <span style="font-size:14px; color:#555;">v2.0</span></h1>

<!-- Selector de sección -->
<div class="card">
  <div class="section-bar">
    <h2>🗂️ Sección actual:</h2>
    <select id="seccionSelect"></select>
    <button id="btnNuevaSeccion" class="btn-primary">Nueva sección</button>
    <div id="contenedorRenombrar" style="display:none; margin-bottom:1rem;" class="card">
        <label>Nuevo nombre para la sección:</label>
        <input type="text" id="inputNuevoNombre" placeholder="Ej: Pasillo_Norte">
        <div style="display:flex; gap:10px;">
            <button class="btn-primary" id="btnConfirmarRenombrar">Confirmar</button>
            <button class="btn-secondary" id="btnCancelarRenombrar">Cancelar</button>
        </div>
    </div>

<button class="btn-secondary" id="btnMostrarRenombrar">Renombrar Sección</button>
  </div>
</div>

<!-- Formulario desviaciones -->
<div class="card">
<form id="formDesv">
<h2 id="formTitulo">Nueva desviación</h2>

<label>Tipo</label>
<div style="display: flex; gap: 8px; margin-bottom: 0.7rem;">
  <select id="tipo" style="margin-bottom: 0; flex: 1;">
    <option value="">Selecciona…</option>
    <option>Almacenamiento</option>
    <option>Productos químicos</option>
    <option>Mangueras</option>
    <option>Herramientas</option>
    <option>Equipos e instalaciones</option>
    <option>Elementos de seguridad y EPI's</option>
    <option>Zonas de paso y comunes</option>
    <option>Señalización y comunicación</option>
    <option>Residuos</option>
  </select>
  <button type="button" id="btnAbrirTags" class="btn-secondary" style="margin: 0; padding: 0 10px; width: auto; white-space: nowrap;">
    🏷️ Sugerencias
  </button>
</div>

<label>Descripción</label>
<textarea id="descripcion"></textarea>

<label>Ubicación</label>
<input type="text" id="ubicacion">

<label>Foto</label>
<input type="file" id="foto" accept="image/*" capture="environment">

<button type="submit" class="btn-primary" id="btnGuardar">Añadir desviación</button>
<button type="button" class="btn-secondary" id="btnCancelarEdicion" style="display:none;">Cancelar edición</button>
</form>
</div>

<!-- Lista desviaciones -->
<div class="card">
<h2><span>📋</span> Desviaciones añadidas</h2>
<div id="lista"></div>
<p id="noDatos">No hay desviaciones aún.</p>
</div>

<!-- Exportación -->
<div class="card">
    <h2><span>🚀</span> Exportar Informe</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;">
        <button class="btn-primary" id="btnDescargarHTML"" style="flex:1;">🌐 HTML</button>
        <button class="btn-primary" id="btnDescargarPDF" style="flex:1;">📕 PDF</button>
	<button class="btn-primary" id="btnDescargarDOCX" style="flex:1;">📝 DOCX</button>
    </div>
</div>

<!-- Zona avanzada -->
<div class="card advanced">
  <h2><span>⚙️</span> Ajustes Avanzados</h2>
  
  <div style="margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px;">
      <span id="espacioTexto">Espacio ocupado: 0%</span>
      <span id="espacioMB">0 / 5 MB</span>
    </div>
    <div style="background: #e0e0e0; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #ccc;">
      <div id="barraProgreso" style="background: #1976d2; width: 0%; height: 100%; transition: width 0.3s;"></div>
    </div>
  </div>

<div class="gestion-datos-container">
    
    <div class="card card-gestion">
        <div class="card-header-mini">
            <span>📄 ESTA SECCIÓN</span>
        </div>
        <div class="card-body-gestion">
            <button id="btnExportarSeccion" class="btn-primary btn-full">📤 Exportar</button>
            <button id="btnImportarSeccion" class="btn-outline btn-full">📥 Importar</button>
            <input type="file" id="inputArchivoSeccion" style="display:none" accept=".json">
        </div>
    </div>

    <div class="card card-gestion">
        <div class="card-header-mini">
            <span>📦 APP COMPLETA</span>
        </div>
        <div class="card-body-gestion">
            <button id="btnExportarJSON" class="btn-primary btn-full">📤 Exportar</button>
            <button id="btnImportarJSON" class="btn-outline btn-full">📥 Restaurar</button>
            <input type="file" id="inputImportar" style="display:none" accept=".json">
        </div>
    </div>

</div>

  <p style="margin-top:0; font-size:0.9rem; color:#555;">Borrar datos:</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;">
      <button id="btnBorrarSeccion" class="btn-danger" style="flex:1;">🗑️ Sección actual</button>
      <button id="btnBorrarTodas" class="btn-danger" style="flex:1;">🧹 Borrar todo</button>
    </div>
</div>

</div>

<script>
 let desviaciones = [];
 let editIndex = null;
 let latitudActual = null;
 let longitudActual = null;

 // Gestión de secciones
 const SECCIONES_KEY = "desviaciones_v1_9_secciones";
 const SECCION_ACTUAL_KEY = "desviaciones_v1_9_seccion_actual";
 const DATA_PREFIX = "desviaciones_v1_9_";

 function $(id){ return document.getElementById(id); }

 const ORDEN_TIPOS = [
     "Almacenamiento","Productos químicos","Mangueras","Herramientas",
     "Equipos e instalaciones","Elementos de seguridad y EPI's",
     "Zonas de paso y comunes","Señalización y comunicación","Residuos"
 ];

 function capturarUbicacionGPS() {
     const statusDiv = document.getElementById("statusGPS");
     latitudActual = null;
     longitudActual = null;
     
     if (statusDiv) {
         statusDiv.innerHTML = "📡 Buscando satélites...";
         statusDiv.style.color = "#666";
     }

     if (!("geolocation" in navigator)) {
         if (statusDiv) statusDiv.innerHTML = "❌ GPS no soportado";
         return;
     }

     navigator.geolocation.getCurrentPosition(
         (pos) => {
             latitudActual = pos.coords.latitude;
             longitudActual = pos.coords.longitude;
             console.log("📍 GPS OK:", latitudActual, longitudActual);
             
             if (statusDiv) {
                 statusDiv.innerHTML = "✅ Ubicación capturada con éxito";
                 statusDiv.style.color = "#007934"; // Verde
             }
         },
         (err) => {
             console.warn("Error GPS:", err.message);
             if (statusDiv) {
                 statusDiv.style.color = "#d32f2f"; // Rojo
                 if (err.code === 1) statusDiv.innerHTML = "❌ Permiso denegado";
                 else if (err.code === 3) statusDiv.innerHTML = "❌ Tiempo agotado (GPS débil)";
                 else statusDiv.innerHTML = "❌ Error al obtener ubicación";
             }
         },
         { 
             enableHighAccuracy: true, 
             timeout: 8000, // Le damos 8 segundos para fijar posición
             maximumAge: 0 
         }
     );
 }

  async function migrarDatos() {
      const migrado = await localforage.getItem("migracion_completada");
      if (migrado) return;

      console.log("🚀 Iniciando migración de localStorage a LocalForage...");
      
      // Migrar lista de secciones
      const secciones = localStorage.getItem(SECCIONES_KEY);
      if (secciones) {
          await localforage.setItem(SECCIONES_KEY, JSON.parse(secciones));
      }

      // Migrar sección actual
      const actual = localStorage.getItem(SECCION_ACTUAL_KEY);
      if (actual) {
          await localforage.setItem(SECCION_ACTUAL_KEY, actual);
      }

      // Migrar datos de cada sección
      for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith(DATA_PREFIX) && key !== SECCIONES_KEY && key !== SECCION_ACTUAL_KEY) {
              const data = localStorage.getItem(key);
              if (data) {
                  await localforage.setItem(key, JSON.parse(data));
              }
          }
      }

      await localforage.setItem("migracion_completada", true);
      console.log("✅ Migración completada.");
  }

  async function cargarSecciones(){
      let lista = [];
      try{
	 const raw = await localforage.getItem(SECCIONES_KEY);
	 if(raw){
	     if(Array.isArray(raw)) lista = raw;
	 }
      }catch(e){}
      if(lista.length === 0){
	 lista = ["seccion_1"];
	 await localforage.setItem(SECCIONES_KEY, lista);
      }
      return lista;
  }

  async function guardarSecciones(lista){
      await localforage.setItem(SECCIONES_KEY, lista);
  }

  async function getSeccionActualId(){
      let id = await localforage.getItem(SECCION_ACTUAL_KEY);
      const secciones = await cargarSecciones();
      if(!id || !secciones.includes(id)){
	 id = secciones[0];
	 await localforage.setItem(SECCION_ACTUAL_KEY, id);
      }
      return id;
  }

  async function setSeccionActualId(id){
      await localforage.setItem(SECCION_ACTUAL_KEY, id);
  }

  async function cargarDatosSeccion(id){
      desviaciones = [];
      try{
	 const raw = await localforage.getItem(DATA_PREFIX + id);
	 if(raw){
	     if(Array.isArray(raw)) desviaciones = raw;
	 }
      }catch(e){}
      editIndex = null;
      $("btnGuardar").textContent = "Añadir desviación";
      $("btnCancelarEdicion").style.display = "none";
      render();
  }

  async function guardarDatosSeccion(id){
      await localforage.setItem(DATA_PREFIX + id, desviaciones);
      await actualizarIndicadorEspacio();
  }

  async function actualizarSelectorSecciones(){
      const secciones = await cargarSecciones();
      const actual = await getSeccionActualId();
      const sel = $("seccionSelect");
      sel.innerHTML = "";
      secciones.forEach(id=>{
	 const opt = document.createElement("option");
	 opt.value = id;
	 opt.textContent = id;
	 if(id === actual) opt.selected = true;
	 sel.appendChild(opt);
      });
  }

 // Reducir imagen
 async function reducir(file){
     return new Promise(res=>{
	 let r=new FileReader();
	 r.onload=e=>{
	     let img=new Image();
	     img.onload=()=>{
		 let MAX=500; // Mantenemos 500px de ancho
		 let sc=MAX/img.width;
		 let c=document.createElement("canvas");
		 c.width=MAX;
		 c.height=img.height*sc;
		 const ctx = c.getContext("2d");

		 // Fondo blanco para evitar transparencias negras en JPEG
		 ctx.fillStyle = "#FFFFFF";
		 ctx.fillRect(0, 0, c.width, c.height);
		 ctx.drawImage(img,0,0,c.width,c.height);

		 // CAMBIO CLAVE: "image/jpeg" con calidad 0.6
		 // Esto hace que la foto pase de 400KB a unos 50KB.
		 res(c.toDataURL("image/jpeg", 0.6));
	     };
	     img.src=e.target.result;
	 };
	 r.readAsDataURL(file);
     });
 }

 // Render lista
 function render(){
     $("formTitulo").textContent = editIndex === null ? `➕ Nueva desviación (${desviaciones.length})` : "✏️ Editar desviación";
     let lista=$("lista");
     lista.innerHTML="";
     if(desviaciones.length===0){$("noDatos").style.display="block";return;}
     $("noDatos").style.display="none";

     [...desviaciones].reverse().forEach((d,i)=>{
	 let real=desviaciones.length-1-i;
	 let div=document.createElement("div");
	 div.className="desv-item";

	 let left=document.createElement("div");
	 left.style.display="flex";

	 if(d.foto){
	     let img=document.createElement("img");
	     img.src=d.foto; img.className="thumb";
	     
	     img.style.cursor = "zoom-in"; // Cambia el cursor para indicar que es clickeable
	     img.onclick = () => ampliarImagen(d.foto); // Llama a la función que creamos antes
	     
	     left.appendChild(img);
	 }

	 let info = document.createElement("div");
	 // 1. Definimos el icono según la disponibilidad
	 // Si hay GPS: Globo terráqueo. Si no: Señal de no disponible.
	 const iconoGPS = (d.lat !== null && d.lon !== null) ? "🌎 " : "🚫 ";
	 
	 // 2. Lo aplicamos al innerHTML
	 info.className = "info-text-wrap"; 
	 info.innerHTML = `
	     <strong>${d.tipo}</strong><br>
	     ${d.descripcion || ""}<br>
	     <span style='color:#666; font-size:12px;'>
		 ${iconoGPS}📍 ${d.ubicacion || "—"}
	     </span>
	 `;
	 left.appendChild(info);

	 let right=document.createElement("div");
	 right.innerHTML=`<button class='btn-secondary btn-small' onclick='editar(${real})'>Editar</button>
	 <button class='btn-danger btn-small' onclick='borrar(${real})'>Borrar</button>`;

	 div.appendChild(left); div.appendChild(right);
	 lista.appendChild(div);
     });
 }

 // Form submit
 async function procesarGuardado() {
     let tipo = $("tipo").value;
     if (!tipo) { alert("Selecciona un tipo"); return; }
     
     let desc = $("descripcion").value.trim();
     let ub = $("ubicacion").value.trim();
     let file = $("foto").files[0];
     let foto = null;

     if (file) foto = await reducir(file);
     let obj = { 
	 tipo, 
	 descripcion: desc, 
	 ubicacion: ub, 
	 foto,
	 lat: latitudActual, 
	 lon: longitudActual 
     };

     if (editIndex === null) {
         desviaciones.push(obj);
     } else {
         if (!foto) obj.foto = desviaciones[editIndex].foto;
         desviaciones[editIndex] = obj;
         editIndex = null;
         $("btnGuardar").textContent = "Añadir desviación";
         $("btnCancelarEdicion").style.display = "none";
     }
     
     // Limpiar campos
     $("descripcion").value = ""; 
     $("ubicacion").value = ""; 
     $("foto").value = ""; 
     $("tipo").value = "";

     await guardarDatosSeccion(await getSeccionActualId());
     render();
     console.log("✅ Guardado automático");
 }

 // Evento del formulario original (clic en botón)
 $("formDesv").addEventListener("submit", async e => {
     e.preventDefault();
     await procesarGuardado();
 });

 // NUEVO: Evento automático al terminar de hacer la foto
 $("foto").onchange = async () => {
     if ($("foto").files && $("foto").files.length > 0) {
         // Un pequeño retraso visual para que el usuario vea que algo pasa
         $("btnGuardar").textContent = "Procesando...";
         await procesarGuardado();
         $("btnGuardar").textContent = "Añadir desviación";
     }
 };

 function editar(i) {
     editIndex = i; 
     let d = desviaciones[i];
     
     // Rellenamos los campos
     $("tipo").value = d.tipo; 
     $("descripcion").value = d.descripcion; 
     $("ubicacion").value = d.ubicacion;
     
     // Cambiamos textos de la interfaz
     $("btnGuardar").textContent = "Guardar cambios"; 
     $("btnCancelarEdicion").style.display = "inline-block";
     
     // Usamos innerHTML para el icono
     $("formTitulo").innerHTML = "✏️ Editar desviación";

     // --- EL SCROLL AUTOMÁTICO ---
     // Esto sube la pantalla hasta el inicio del formulario
     $("formDesv").scrollIntoView({ behavior: 'smooth', block: 'start' });
 }

  async function borrar(i){
      if(!confirm("¿Seguro que quieres borrar esta desviación?"))return;
      desviaciones.splice(i,1);
      await guardarDatosSeccion(await getSeccionActualId());
      render();
  }

 $("btnCancelarEdicion").onclick=()=>{
     editIndex=null;
     $("btnGuardar").textContent="Añadir desviación";
     $("btnCancelarEdicion").style.display="none";
     render();
     $("descripcion").value="";$("ubicacion").value="";$("foto").value="";$("tipo").value="";
 };

 // Nueva sección
 $("btnNuevaSeccion").onclick = async () => {
     // 1. Actualizamos el mensaje de ayuda
     let nombre = prompt("Nombre de la nueva sección (puedes usar espacios y tildes):");
     if (!nombre) return;
     
     nombre = nombre.trim();
     if (!nombre) return;

     // 2. Eliminamos las líneas que quitaban espacios y caracteres especiales
     // Solo eliminamos caracteres que podrían dar problemas en nombres de archivos al exportar
     // ( \ / : * ? " < > | )
     nombre = nombre.replace(/[\\/:*?"<>|]/g, "");

  if (!nombre) {
    alert("Nombre no válido.");
    return;
  }

  let secciones = await cargarSecciones();
  if (secciones.includes(nombre)) {
    alert("Ya existe una sección con ese nombre.");
    return;
  }

  secciones.push(nombre);
  await guardarSecciones(secciones);
  await setSeccionActualId(nombre);
  desviaciones = [];
  editIndex = null;
  await actualizarSelectorSecciones();
  await cargarDatosSeccion(nombre);
};

// Renombrar sección
// Mostrar/Ocultar el panel de renombrado
 $("btnMostrarRenombrar").onclick = async () => {
    $("inputNuevoNombre").value = await getSeccionActualId();
    $("contenedorRenombrar").style.display = "block";
    $("btnMostrarRenombrar").style.display = "none";
};

$("btnCancelarRenombrar").onclick = () => {
    $("contenedorRenombrar").style.display = "none";
    $("btnMostrarRenombrar").style.display = "inline-block";
};

// Lógica de guardado real
 $("btnConfirmarRenombrar").onclick = async () => {
     const actual = await getSeccionActualId();
     let nuevo = $("inputNuevoNombre").value;

     if (!nuevo) return;

     // Aplicamos la misma lógica permisiva que en la creación
     nuevo = nuevo.trim().replace(/[\\/:*?"<>|]/g, "");

      if (!nuevo || nuevo === actual) {
          $("btnCancelarRenombrar").click();
          return;
      }

      let secciones = await cargarSecciones();
      if (secciones.includes(nuevo)) {
          alert("Ese nombre ya existe.");
          return;
      }

      // El resto del código de mover datos y actualizar secciones se mantiene igual...
      const datos = await localforage.getItem(DATA_PREFIX + actual);
      if (datos !== null) {
          await localforage.setItem(DATA_PREFIX + nuevo, datos);
          await localforage.removeItem(DATA_PREFIX + actual);
      }

      secciones = secciones.map(id => id === actual ? nuevo : id);
      await guardarSecciones(secciones);
      await setSeccionActualId(nuevo);

      window.location.reload();
  };

 // Cambio de sección
  $("seccionSelect").addEventListener("change",async ()=>{
      const id = $("seccionSelect").value;
      await setSeccionActualId(id);
      await cargarDatosSeccion(id);
  });

 // Borrar sección
  $("btnBorrarSeccion").onclick=async ()=>{
      const secciones = await cargarSecciones();
      const actual = await getSeccionActualId();
      if(!confirm("¿Borrar la sección \""+actual+"\" y todas sus desviaciones?")) return;
      await localforage.removeItem(DATA_PREFIX + actual);
      const nuevas = secciones.filter(s=>s!==actual);
      if(nuevas.length === 0){
 	 nuevas.push("seccion_1");
 	 await localforage.setItem(DATA_PREFIX + "seccion_1", []);
      }
      await guardarSecciones(nuevas);
      await setSeccionActualId(nuevas[0]);
      await actualizarSelectorSecciones();
      await cargarDatosSeccion(await getSeccionActualId());
  };

 // Borrar todas las secciones
  $("btnBorrarTodas").onclick=async ()=>{
      if(!confirm("¿Borrar TODAS las secciones y todas las desviaciones?")) return;
      const secciones = await cargarSecciones();
      for (const id of secciones) {
          await localforage.removeItem(DATA_PREFIX + id);
      }
      await localforage.removeItem(SECCIONES_KEY);
      await localforage.removeItem(SECCION_ACTUAL_KEY);
      const lista = ["seccion_1"];
      await guardarSecciones(lista);
      await setSeccionActualId("seccion_1");
      desviaciones = [];
      editIndex = null;
      await actualizarSelectorSecciones();
      await cargarDatosSeccion("seccion_1");
  };

 // Resumen
 function resumen(grupos){
     let arr=[];
     ORDEN_TIPOS.forEach(t=>{
	 if(grupos[t]&&grupos[t].length>0){
	     let n=grupos[t].length;
	     arr.push(`${t}: ${n} ${n===1?"desviación":"desviaciones"}`);
	 }
     });
     return arr;
 }

 // Exportar HTML
 $("btnDescargarHTML").onclick = () => {
     if (desviaciones.length === 0) {
         alert("No hay datos para exportar");
         return;
     }

     // Capturamos la sección seleccionada
     const combo = document.getElementById("seccionSelect");
     const nombreSeccion = combo.options[combo.selectedIndex].text;

     // Llamamos a la nueva función externa
     generarHTML(desviaciones, nombreSeccion);
 };

 // Exportar PDF
 $("btnDescargarPDF").onclick = async () => {
     if (desviaciones.length === 0) {
         alert("No hay datos para exportar");
         return;
     }

     // Solicitamos los datos para la portada
     // Configuramos el formato: mes largo y año numérico
     const opciones = { month: 'long', year: 'numeric' };
     let fechaPorDefecto = new Date().toLocaleDateString('es-ES', opciones);

     // La salida estándar es "marzo de 2026", vamos a poner la primera en mayúscula
     // y quitar el " de " si prefieres el formato exacto "Marzo 2026"
     fechaPorDefecto = fechaPorDefecto.charAt(0).toUpperCase() + fechaPorDefecto.slice(1);
     fechaPorDefecto = fechaPorDefecto.replace(" de ", " ");

     const fechaManual = prompt("Introduce la fecha para el informe (ej: Abril 2026):", fechaPorDefecto);

     const notaManual = prompt("Introduce el resultado de la auditoría (ej: 85):");
     if (notaManual === null) return; // Cancelado

     const combo = document.getElementById("seccionSelect");
     const nombreSeccion = combo.options[combo.selectedIndex].text; 

     try {
         // Pasamos los nuevos datos a la función generarPDF
         await generarPDF(desviaciones, nombreSeccion, fechaManual, notaManual);
     } catch (error) {
         console.error("Error en la exportación:", error);
         alert("Error al generar el PDF. Revisa la consola.");
     }
 };

// Exportar DOCX - ESTRATEGIA PDF CORREGIDA
$("btnDescargarDOCX").onclick = async () => {
    const actual = await getSeccionActualId();
    if (!actual) return alert("No hay sección seleccionada");

    const nombreSeccion = actual.replace(/_/g, " ");
    const datos = await localforage.getItem(DATA_PREFIX + actual) || [];

    if (datos.length === 0) return alert("No hay datos en esta sección");

    // Generamos la fecha por defecto de forma segura
    const ahora = new Date();
    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const fechaSugerida = `${meses[ahora.getMonth()]} ${ahora.getFullYear()}`;

    // --- PREGUNTAS AL USUARIO ---
    const fechaManual = prompt("Introduce la fecha para el informe:", fechaSugerida) || fechaSugerida;
    const notaManual = prompt("Introduce el resultado (ej: 85) o una nota general:", "") || "";

    const resumen = {};
    datos.forEach(d => { resumen[d.tipo] = (resumen[d.tipo] || 0) + 1; });

    // Código de fecha seguro para el nombre del archivo (YYYYMMDD)
    const isoDate = ahora.toISOString();
    const codigoFecha = isoDate ? isoDate.slice(0, 10).replace(/-/g, '') : "20260101";

    // Llamada con las 6 variables
    exportarAWord(nombreSeccion, datos, resumen, fechaManual, notaManual, codigoFecha);
 };

 // --- FUNCIONES DE MEMORIA Y BACKUP PARA V1.9 ---

  async function actualizarIndicadorEspacio() {
      let totalBytes = 0;
      await localforage.iterate((value, key) => {
          totalBytes += (JSON.stringify(value).length + key.length);
      });
      
      const limite = 50 * 1024 * 1024; // Aumentamos el límite visual a 50MB
      const porcentaje = Math.min((totalBytes / limite) * 100, 100).toFixed(1);
      const mbOcupados = (totalBytes / (1024 * 1024)).toFixed(2);

      if($("espacioTexto")){
          $("espacioTexto").textContent = `Espacio ocupado: ${porcentaje}%`;
          $("espacioMB").textContent = `${mbOcupados} / 50 MB`;
          $("barraProgreso").style.width = porcentaje + "%";
          $("barraProgreso").style.background = porcentaje > 80 ? "#d32f2f" : (porcentaje > 50 ? "#f57c00" : "#1976d2");
      }
  }

 // EXPORTAR (BACKUP)
  $("btnExportarJSON").onclick = async () => {
      const backup = {
          app: "Informe O&L v1.9 (LocalForage)",
          fecha: new Date().toISOString(),
          secciones: await localforage.getItem(SECCIONES_KEY) || [],
          datos: {}
      };

      await localforage.iterate((value, key) => {
          if (key.startsWith(DATA_PREFIX) && key !== SECCIONES_KEY && key !== SECCION_ACTUAL_KEY) {
              backup.datos[key] = value;
          }
      });

      const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `BACKUP_OL_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
  };

  $("btnExportarSeccion").onclick = async () => {
      const seccionId = await getSeccionActualId(); 
      
      if (!desviaciones || desviaciones.length === 0) {
          alert("No hay datos en esta sección para exportar.");
          return;
      }

      // Estructuramos el objeto de exportación
      const datosAExportar = {
          tipo: "OYL_SECTION_EXPORT",
          version: "2.0",
          nombreSeccion: seccionId,
          fechaExportacion: new Date().toISOString(),
          datos: desviaciones 
      };

      // Crear el archivo para descargar
      const dataStr = JSON.stringify(datosAExportar, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      const fechaCompacta = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `Datos_${seccionId.replace(/\s+/g, '_')}_${fechaCompacta}.json`;
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
  };

 // IMPORTAR (RESTAURAR)
  $("btnImportarJSON").onclick = () => $("inputImportar").click();

  $("inputImportar").onchange = (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = async (event) => {
          try {
              const backup = JSON.parse(event.target.result);
              if (!backup.secciones || !backup.datos) throw new Error("Archivo no válido");
              
              if (confirm("Se borrarán los datos actuales para cargar el backup. ¿Continuar?")) {
                  await localforage.clear();
                  await localforage.setItem(SECCIONES_KEY, backup.secciones);
                  for (const clave in backup.datos) {
                      await localforage.setItem(clave, backup.datos[clave]);
                  }
                  alert("✅ Importación completada.");
                  location.reload();
              }
          } catch (err) { alert("Error: " + err.message); }
      };
      lector.readAsText(archivo);
  };

 // 2. Cuando el usuario selecciona un archivo...
 $("inputArchivoSeccion").onchange = async (e) => {
     const archivo = e.target.files[0];
     if (!archivo) return;

     const reader = new FileReader();
     reader.onload = async (event) => {
         try {
             const contenido = JSON.parse(event.target.result);

             // Validamos que sea un archivo de sección y no un backup general
             if (contenido.tipo !== "OYL_SECTION_EXPORT") {
                 alert("Este archivo no es una exportación de sección válida.");
                 return;
             }

             let nombreSugerido = contenido.nombreSeccion;
             let secciones = await cargarSecciones();

             // Si la sección ya existe, preguntamos si quiere sobrescribir o renombrar
             if (secciones.includes(nombreSugerido)) {
                 const confirmacion = confirm(`La sección "${nombreSugerido}" ya existe. ¿Quieres sobrescribir los datos actuales? \n(Aceptar: Sobrescribir / Cancelar: Importar con otro nombre)`);
                 
                 if (!confirmacion) {
                     const nuevoNombre = prompt("Introduce un nuevo nombre para esta sección:", nombreSugerido + "_Copia");
                     if (!nuevoNombre) return; // Canceló todo
                     nombreSugerido = nuevoNombre.trim();
                 }
             }

             // --- GUARDADO DE DATOS ---
             // Guardamos las desviaciones en el localforage
             await localforage.setItem(DATA_PREFIX + nombreSugerido, contenido.datos);

             // Si es una sección nueva, la añadimos a la lista global de secciones
             if (!secciones.includes(nombreSugerido)) {
                 secciones.push(nombreSugerido);
                 await guardarSecciones(secciones);
             }

             // Cambiamos a la sección recién importada y recargamos
             await setSeccionActualId(nombreSugerido);
             alert("Sección '" + nombreSugerido + "' importada correctamente.");
             window.location.reload();

         } catch (error) {
             console.error(error);
             alert("Error al leer el archivo. Asegúrate de que sea un JSON válido.");
         }
     };
     reader.readAsText(archivo);
     
     // Limpiamos el input para poder subir el mismo archivo otra vez si fuera necesario
     e.target.value = ""; 
 };

 let timerCierreModal; // Variable para el temporizador

 function ampliarImagen(src) {
     clearTimeout(timerCierreModal); // Cancela cualquier temporizador previo
     const modal = $("modalImagen");
     const img = $("imgModal");
     
     img.src = src; // Carga la imagen pulsada
     modal.style.display = "block"; // Muestra el modal

     // Temporizador: cerrar automáticamente tras 5 segundos
     timerCierreModal = setTimeout(() => {
         cerrarImagen(modal);
     }, 5000); // 5000ms = 5 segundos
 }

 function cerrarImagen(modal) {
     clearTimeout(timerCierreModal); // Cancela el temporizador si cierran manualmente
     modal.style.display = "none"; // Oculta el modal
 }

//////// Nube de tags
// --- Lógica de Nube de Tags Simplificada ---
let configuracionTags = {};

async function cargarTags() {
    try {
        const res = await fetch('tags.json');
        configuracionTags = await res.json();
        const contenedor = $("contenedorNube");
        contenedor.innerHTML = "";

        for (const [categoria, tags] of Object.entries(configuracionTags)) {
            const grupo = document.createElement("div");
            grupo.className = "tag-group";
            grupo.innerHTML = `<h4>${categoria}</h4>`;
            
            const nube = document.createElement("div");
            nube.className = "tag-cloud";
            
            tags.forEach(t => {
                const chip = document.createElement("span");
                chip.className = "tag-chip";
                chip.textContent = t;
                chip.onclick = () => {
                    $("tipo").value = categoria; // Selecciona el tipo
                    $("modalTags").style.display = "none"; // Cierre automático
                };
                nube.appendChild(chip);
            });
            grupo.appendChild(nube);
            contenedor.appendChild(grupo);
        }
    } catch (e) { console.error("Error al cargar tags.json", e); }
}

// Inyección del modal (Solo el contenedor de la nube)
document.body.insertAdjacentHTML('beforeend', `
    <div id="modalTags" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div id="contenedorNube"></div>
        </div>
    </div>
`);

// Abrir modal
$("btnAbrirTags").onclick = () => {
    $("modalTags").style.display = "flex";
    if (Object.keys(configuracionTags).length === 0) cargarTags();
};

// Cierre de seguridad: cerrar si se pulsa fuera de la nube (en el fondo oscuro)
$("modalTags").onclick = (e) => {
    if (e.target.id === "modalTags") {
        $("modalTags").style.display = "none";
    }
};
