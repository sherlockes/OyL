<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe de O&L v2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="app">

<h1>Informe de O&L <span style="font-size:14px; color:#555;">v2.0</span></h1>

<!-- Selector de sección -->
<div class="card">
  <div class="section-bar">
    <h2>🗂️ Sección actual:</h2>
    <select id="seccionSelect"></select>
    <button id="btnNuevaSeccion" class="btn-primary">Nueva sección</button>
    <div id="contenedorRenombrar" style="display:none; margin-bottom:1rem;" class="card">
        <label>Nuevo nombre para la sección:</label>
        <input type="text" id="inputNuevoNombre" placeholder="Ej: Pasillo_Norte">
        <div style="display:flex; gap:10px;">
            <button class="btn-primary" id="btnConfirmarRenombrar">Confirmar</button>
            <button class="btn-secondary" id="btnCancelarRenombrar">Cancelar</button>
        </div>
    </div>

<button class="btn-secondary" id="btnMostrarRenombrar">Renombrar Sección</button>
  </div>
</div>

<!-- Formulario desviaciones -->
<div class="card">
<form id="formDesv">
<h2 id="formTitulo">Nueva desviación</h2>

<label>Tipo</label>
<select id="tipo">
  <option value="">Selecciona…</option>
  <option>Almacenamiento</option>
  <option>Productos químicos</option>
  <option>Mangueras</option>
  <option>Herramientas</option>
  <option>Equipos e instalaciones</option>
  <option>Elementos de seguridad y EPI's</option>
  <option>Zonas de paso y comunes</option>
  <option>Señalización y comunicación</option>
  <option>Residuos</option>
</select>

<label>Descripción</label>
<textarea id="descripcion"></textarea>

<label>Ubicación</label>
<input type="text" id="ubicacion">

<label>Foto</label>
<input type="file" id="foto" accept="image/*" capture="environment">

<button type="submit" class="btn-primary" id="btnGuardar">Añadir desviación</button>
<button type="button" class="btn-secondary" id="btnCancelarEdicion" style="display:none;">Cancelar edición</button>
</form>
</div>

<!-- Lista desviaciones -->
<div class="card">
<h2><span>📋</span> Desviaciones añadidas</h2>
<div id="lista"></div>
<p id="noDatos">No hay desviaciones aún.</p>
</div>

<!-- Exportación -->
<div class="card">
    <h2><span>🚀</span> Exportar Informe</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;">
        <button class="btn-primary" id="btnDescargarHTML"" style="flex:1;">🌐 HTML</button>
        <button class="btn-primary" id="btnDescargarPDF" style="flex:1;">📕 PDF</button>
    </div>
</div>

<!-- Zona avanzada -->
<div class="card advanced">
  <h2><span>⚙️</span> Ajustes Avanzados</h2>
  
  <div style="margin-bottom: 1.5rem;">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px;">
      <span id="espacioTexto">Espacio ocupado: 0%</span>
      <span id="espacioMB">0 / 5 MB</span>
    </div>
    <div style="background: #e0e0e0; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; border: 1px solid #ccc;">
      <div id="barraProgreso" style="background: #1976d2; width: 0%; height: 100%; transition: width 0.3s;"></div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;">
    <button id="btnExportarJSON" class="btn-primary" style="flex:1;">📤 Exportar</button>
    <button id="btnImportarJSON" class="btn-primary" style="flex:1;">📥 Importar</button>
    <input type="file" id="inputImportar" style="display:none" accept=".json">
  </div>

  <p style="margin-top:0; font-size:0.9rem; color:#555;">Borrar datos:</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem;">
      <button id="btnBorrarSeccion" class="btn-danger" style="flex:1;">🗑️ Sección actual</button>
      <button id="btnBorrarTodas" class="btn-danger" style="flex:1;">🗑️ Borrar todo</button>
    </div>
</div>

</div>

<script>
let desviaciones = [];
let editIndex = null;

// Gestión de secciones
const SECCIONES_KEY = "desviaciones_v1_9_secciones";
const SECCION_ACTUAL_KEY = "desviaciones_v1_9_seccion_actual";
const DATA_PREFIX = "desviaciones_v1_9_";

function $(id){ return document.getElementById(id); }

const ORDEN_TIPOS = [
  "Almacenamiento","Productos químicos","Mangueras","Herramientas",
  "Equipos e instalaciones","Elementos de seguridad y EPI's",
  "Zonas de paso y comunes","Señalización y comunicación","Residuos"
];

function cargarSecciones(){
  let lista = [];
  try{
    const raw = localStorage.getItem(SECCIONES_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) lista = parsed;
    }
  }catch(e){}
  if(lista.length === 0){
    lista = ["seccion_1"];
    localStorage.setItem(SECCIONES_KEY, JSON.stringify(lista));
  }
  return lista;
}

function guardarSecciones(lista){
  localStorage.setItem(SECCIONES_KEY, JSON.stringify(lista));
}

function getSeccionActualId(){
  let id = localStorage.getItem(SECCION_ACTUAL_KEY);
  const secciones = cargarSecciones();
  if(!id || !secciones.includes(id)){
    id = secciones[0];
    localStorage.setItem(SECCION_ACTUAL_KEY, id);
  }
  return id;
}

function setSeccionActualId(id){
  localStorage.setItem(SECCION_ACTUAL_KEY, id);
}

function cargarDatosSeccion(id){
  desviaciones = [];
  try{
    const raw = localStorage.getItem(DATA_PREFIX + id);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) desviaciones = parsed;
    }
  }catch(e){}
  editIndex = null;
  $("btnGuardar").textContent = "Añadir desviación";
  $("btnCancelarEdicion").style.display = "none";
  $("formTitulo").textContent = "➕ Nueva desviación";
  render();
}

function guardarDatosSeccion(id){
    localStorage.setItem(DATA_PREFIX + id, JSON.stringify(desviaciones));
    actualizarIndicadorEspacio();
}

function actualizarSelectorSecciones(){
  const secciones = cargarSecciones();
  const actual = getSeccionActualId();
  const sel = $("seccionSelect");
  sel.innerHTML = "";
  secciones.forEach(id=>{
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = id;
    if(id === actual) opt.selected = true;
    sel.appendChild(opt);
  });
}

// Reducir imagen
async function reducir(file){
 return new Promise(res=>{
  let r=new FileReader();
  r.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    let MAX=500; // Mantenemos 500px de ancho
    let sc=MAX/img.width;
    let c=document.createElement("canvas");
    c.width=MAX;
    c.height=img.height*sc;
    const ctx = c.getContext("2d");

    // Fondo blanco para evitar transparencias negras en JPEG
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img,0,0,c.width,c.height);

    // CAMBIO CLAVE: "image/jpeg" con calidad 0.6
    // Esto hace que la foto pase de 400KB a unos 50KB.
    res(c.toDataURL("image/jpeg", 0.6));
   };
   img.src=e.target.result;
  };
  r.readAsDataURL(file);
 });
}

// Render lista
function render(){
 let lista=$("lista");
 lista.innerHTML="";
 if(desviaciones.length===0){$("noDatos").style.display="block";return;}
 $("noDatos").style.display="none";

 [...desviaciones].reverse().forEach((d,i)=>{
  let real=desviaciones.length-1-i;
  let div=document.createElement("div");
  div.className="desv-item";

  let left=document.createElement("div");
  left.style.display="flex";

  if(d.foto){
    let img=document.createElement("img");
    img.src=d.foto; img.className="thumb";
    left.appendChild(img);
  }

  let info = document.createElement("div");
    // Añadimos la clase info-text-wrap para que el CSS la controle
    info.className = "info-text-wrap"; 
    info.innerHTML = `<strong>${d.tipo}</strong><br>${d.descripcion || ""}<br><span style='color:#666; font-size:12px;'>📍 ${d.ubicacion || "—"}</span>`;
    left.appendChild(info);

  let right=document.createElement("div");
  right.innerHTML=`<button class='btn-secondary btn-small' onclick='editar(${real})'>Editar</button>
  <button class='btn-danger btn-small' onclick='borrar(${real})'>Borrar</button>`;

  div.appendChild(left); div.appendChild(right);
  lista.appendChild(div);
 });
}

// Form submit
async function procesarGuardado() {
    let tipo = $("tipo").value;
    if (!tipo) { alert("Selecciona un tipo"); return; }
    
    let desc = $("descripcion").value.trim();
    let ub = $("ubicacion").value.trim();
    let file = $("foto").files[0];
    let foto = null;

    if (file) foto = await reducir(file);
    let obj = { tipo, descripcion: desc, ubicacion: ub, foto };

    if (editIndex === null) {
        desviaciones.push(obj);
    } else {
        if (!foto) obj.foto = desviaciones[editIndex].foto;
        desviaciones[editIndex] = obj;
        editIndex = null;
        $("btnGuardar").textContent = "Añadir desviación";
        $("btnCancelarEdicion").style.display = "none";
        $("formTitulo").textContent = "➕ Nueva desviación";
    }

    // Limpiar campos
    $("descripcion").value = ""; 
    $("ubicacion").value = ""; 
    $("foto").value = ""; 
    $("tipo").value = "";

    guardarDatosSeccion(getSeccionActualId());
    render();
    console.log("✅ Guardado automático");
}

// Evento del formulario original (clic en botón)
$("formDesv").addEventListener("submit", async e => {
    e.preventDefault();
    await procesarGuardado();
});

// NUEVO: Evento automático al terminar de hacer la foto
$("foto").onchange = async () => {
    if ($("foto").files && $("foto").files.length > 0) {
        // Un pequeño retraso visual para que el usuario vea que algo pasa
        $("btnGuardar").textContent = "Procesando...";
        await procesarGuardado();
        $("btnGuardar").textContent = "Añadir desviación";
    }
};

function editar(i) {
    editIndex = i; 
    let d = desviaciones[i];
    
    // Rellenamos los campos
    $("tipo").value = d.tipo; 
    $("descripcion").value = d.descripcion; 
    $("ubicacion").value = d.ubicacion;
    
    // Cambiamos textos de la interfaz
    $("btnGuardar").textContent = "Guardar cambios"; 
    $("btnCancelarEdicion").style.display = "inline-block";
    
    // Usamos innerHTML para el icono
    $("formTitulo").innerHTML = "✏️ Editar desviación";

    // --- EL SCROLL AUTOMÁTICO ---
    // Esto sube la pantalla hasta el inicio del formulario
    $("formDesv").scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function borrar(i){
 if(!confirm("¿Seguro que quieres borrar esta desviación?"))return;
 desviaciones.splice(i,1);
 guardarDatosSeccion(getSeccionActualId());
 render();
}

$("btnCancelarEdicion").onclick=()=>{
 editIndex=null;
 $("btnGuardar").textContent="Añadir desviación";
 $("btnCancelarEdicion").style.display="none";
 $("formTitulo").textContent="➕ Nueva desviación";
 $("descripcion").value="";$("ubicacion").value="";$("foto").value="";$("tipo").value="";
};

// Nueva sección
$("btnNuevaSeccion").onclick=()=>{
  let nombre = prompt("Nombre de la nueva sección (usa letras, números y guiones bajos \"_\"):");
  if(!nombre) return;
  nombre = nombre.trim();
  if(!nombre) return;
  nombre = nombre.replace(/\s+/g, "_");
  nombre = nombre.replace(/[^A-Za-z0-9_]/g, "");
  if(!nombre){
    alert("Nombre no válido.");
    return;
  }
  let secciones = cargarSecciones();
  if(secciones.includes(nombre)){
    alert("Ya existe una sección con ese nombre.");
    return;
  }
  secciones.push(nombre);
  guardarSecciones(secciones);
  setSeccionActualId(nombre);
  desviaciones = [];
  editIndex = null;
  actualizarSelectorSecciones();
  cargarDatosSeccion(nombre);
};

// Renombrar sección
// Mostrar/Ocultar el panel de renombrado
$("btnMostrarRenombrar").onclick = () => {
    $("inputNuevoNombre").value = getSeccionActualId();
    $("contenedorRenombrar").style.display = "block";
    $("btnMostrarRenombrar").style.display = "none";
};

$("btnCancelarRenombrar").onclick = () => {
    $("contenedorRenombrar").style.display = "none";
    $("btnMostrarRenombrar").style.display = "inline-block";
};

// Lógica de guardado real
$("btnConfirmarRenombrar").onclick = () => {
    const actual = getSeccionActualId();
    let nuevo = $("inputNuevoNombre").value;

    if (!nuevo) return;
    nuevo = nuevo.trim().replace(/\s+/g, "_").replace(/[^A-Za-z0-9_]/g, "");

    if (!nuevo || nuevo === actual) {
        $("btnCancelarRenombrar").click();
        return;
    }

    let secciones = cargarSecciones();
    if (secciones.includes(nuevo)) {
        alert("Ese nombre ya existe.");
        return;
    }

    // Mover datos
    const datos = localStorage.getItem(DATA_PREFIX + actual);
    if (datos !== null) {
        localStorage.setItem(DATA_PREFIX + nuevo, datos);
        localStorage.removeItem(DATA_PREFIX + actual);
    }

    // Actualizar lista de secciones
    secciones = secciones.map(id => id === actual ? nuevo : id);
    guardarSecciones(secciones);
    setSeccionActualId(nuevo);

    // En lugar de alert, recargamos directamente para limpiar Vivaldi
    window.location.reload();
};
// Cambio de sección
$("seccionSelect").addEventListener("change",()=>{
  const id = $("seccionSelect").value;
  setSeccionActualId(id);
  cargarDatosSeccion(id);
});

// Borrar sección
$("btnBorrarSeccion").onclick=()=>{
  const secciones = cargarSecciones();
  const actual = getSeccionActualId();
  if(!confirm("¿Borrar la sección \""+actual+"\" y todas sus desviaciones?")) return;
  localStorage.removeItem(DATA_PREFIX + actual);
  const nuevas = secciones.filter(s=>s!==actual);
  if(nuevas.length === 0){
    nuevas.push("seccion_1");
    localStorage.setItem(DATA_PREFIX + "seccion_1", JSON.stringify([]));
  }
  guardarSecciones(nuevas);
  setSeccionActualId(nuevas[0]);
  actualizarSelectorSecciones();
  cargarDatosSeccion(getSeccionActualId());
};

// Borrar todas las secciones
$("btnBorrarTodas").onclick=()=>{
  if(!confirm("¿Borrar TODAS las secciones y todas las desviaciones?")) return;
  const secciones = cargarSecciones();
  secciones.forEach(id=>{
    localStorage.removeItem(DATA_PREFIX + id);
  });
  localStorage.removeItem(SECCIONES_KEY);
  localStorage.removeItem(SECCION_ACTUAL_KEY);
  const lista = ["seccion_1"];
  guardarSecciones(lista);
  setSeccionActualId("seccion_1");
  desviaciones = [];
  editIndex = null;
  actualizarSelectorSecciones();
  cargarDatosSeccion("seccion_1");
};

// Resumen
function resumen(grupos){
 let arr=[];
 ORDEN_TIPOS.forEach(t=>{
  if(grupos[t]&&grupos[t].length>0){
   let n=grupos[t].length;
   arr.push(`${t}: ${n} ${n===1?"desviación":"desviaciones"}`);
  }
 });
 return arr;
}

// Exportar HTML
$("btnDescargarHTML").onclick = () => {
    if (desviaciones.length === 0) {
        alert("No hay datos para exportar");
        return;
    }

    // Capturamos la sección seleccionada
    const combo = document.getElementById("seccionSelect");
    const nombreSeccion = combo.options[combo.selectedIndex].text;

    // Llamamos a la nueva función externa
    generarHTML(desviaciones, nombreSeccion);
};

// Exportar PDF
$("btnDescargarPDF").onclick = async () => {
    // 1. Verificación básica
    if (desviaciones.length === 0) {
        alert("No hay datos para exportar");
        return;
    }

    // --- NUEVO: Capturar el valor del desplegable ---
    // Usamos el ID del select que mencionaste: 'seccionSelect'
    const combo = document.getElementById("seccionSelect");
    const nombreSeccion = combo.options[combo.selectedIndex].text; 

    // 2. Llamada al módulo externo
    try {
        // PASAMOS 'nombreSeccion' en lugar del texto fijo entre comillas
        await generarPDF(desviaciones, nombreSeccion);
    } catch (error) {
        console.error("Error en la exportación:", error);
        alert("Error al generar el PDF. Revisa la consola.");
    }
};


// Control de versiones y carga automática de CSS y JS
(function() {
  const ahora = new Date();
  const v = ahora.getFullYear() + 
            ("0" + (ahora.getMonth() + 1)).slice(-2) + 
            ("0" + ahora.getDate()).slice(-2) + 
            ("0" + ahora.getHours()).slice(-2) +

  // --- CARGA DEL CSS ---

  const scripts = ["js/export-pdf.js", "js/export-html.js"];

    const s = document.createElement('script');
    s.src = `${src}?v=${v}`;
    s.async = false; 
    document.head.appendChild(s);
  });

  console.log("🚀 Sistema cargado con versión: " + v);
  
  // Ejecutamos el render inicial por si ya había datos en localStorage
  if(typeof render === "function") render();
})();

// --- FUNCIONES DE MEMORIA Y BACKUP PARA V1.9 ---

function actualizarIndicadorEspacio() {
    let totalCaracteres = 0;
    for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        totalCaracteres += (localStorage.getItem(key).length + key.length);
    }
    const limite = 5 * 1024 * 1024; // 5MB
    const porcentaje = Math.min((totalCaracteres / limite) * 100, 100).toFixed(1);
    const mbOcupados = (totalCaracteres / (1024 * 1024)).toFixed(2);

    if($("espacioTexto")){
        $("espacioTexto").textContent = `Espacio ocupado: ${porcentaje}%`;
        $("espacioMB").textContent = `${mbOcupados} / 5 MB`;
        $("barraProgreso").style.width = porcentaje + "%";
        $("barraProgreso").style.background = porcentaje > 80 ? "#d32f2f" : (porcentaje > 50 ? "#f57c00" : "#1976d2");
    }
}

// EXPORTAR (BACKUP)
$("btnExportarJSON").onclick = () => {
    const backup = {
        app: "Informe O&L v1.9",
        fecha: new Date().toISOString(),
        secciones: JSON.parse(localStorage.getItem("desviaciones_v1_9_secciones") || '[]'),
        datos: {}
    };

    // Buscamos todas las claves que empiecen por tu prefijo real
    for (let i = 0; i < localStorage.length; i++) {
        const clave = localStorage.key(i);
        if (clave.startsWith("desviaciones_v1_9_") && clave !== "desviaciones_v1_9_secciones" && clave !== "desviaciones_v1_9_seccion_actual") {
            try {
                backup.datos[clave] = JSON.parse(localStorage.getItem(clave));
            } catch (e) {}
        }
    }

    const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `BACKUP_OL_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
};

// IMPORTAR (RESTAURAR)
$("btnImportarJSON").onclick = () => $("inputImportar").click();

$("inputImportar").onchange = (e) => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = (event) => {
        try {
            const backup = JSON.parse(event.target.result);
            if (!backup.secciones || !backup.datos) throw new Error("Archivo no válido");
            
            if (confirm("Se borrarán los datos actuales para cargar el backup. ¿Continuar?")) {
                localStorage.clear();
                localStorage.setItem("desviaciones_v1_9_secciones", JSON.stringify(backup.secciones));
                for (const clave in backup.datos) {
                    localStorage.setItem(clave, JSON.stringify(backup.datos[clave]));
                }
                alert("✅ Importación completada.");
                location.reload();
            }
        } catch (err) { alert("Error: " + err.message); }
    };
    lector.readAsText(archivo);
};

// Inicio
(function init(){
    const secciones = cargarSecciones();
    const actual = getSeccionActualId();
    actualizarSelectorSecciones();
    cargarDatosSeccion(actual);
    actualizarIndicadorEspacio();
})();
</script>

</body></html>
